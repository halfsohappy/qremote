; PlatformIO project for the Waveshare ESP32-S3-LCD-1.69 (non-touch)
;   MCU:     ESP32-S3R8  (16 MB QIO flash, 8 MB octal PSRAM)
;   Display: 1.69" IPS, 240x280, ST7789V2 over 4-wire SPI (unused by this
;            firmware — see README.md, this unit's screen is dead)
;
; Receiving half of the qremote system: listens for light_cmd_t packets
; over ESP-NOW (sent by the ../ dongle's OSC bridge) and drives 4x RGBW
; LED strips through a PCA9685, plus a solenoid prop effect.

[env:esp32-s3-lcd-169]
; Stock platform -> Arduino core 2.0.x. For core 3.x (what Waveshare's docs
; target) run `pio upgrade` (needs Core >= 6.2) and switch to:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM (ESP32-S3R8: octal PSRAM, quad flash) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; --- Serial ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    ; Native USB: serial console over the USB-C port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; Shared ESP-NOW wire protocol with ../src (the qremote OSC dongle)
    -I../shared
